lightning:
  logger:
    target: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    params:
      save_dir: logs
      name: biden_style_adapt_stage2
  modelcheckpoint:
    target: pytorch_lightning.callbacks.ModelCheckpoint
    params:
      monitor: val/net_loss
      mode: min
      save_top_k: 1
      save_last: True
      filename: epoch_{epoch:02d}-val_loss_{val/net_loss:.4f}
  callbacks: []
  trainer:
    max_epochs: 100
    check_val_every_n_epoch: 5
    save_top_k: 1
    progress_bar_refresh_rate: 50
    accumulate_grad_batches: 1
    early_stopping_metric:
      patience: 10
      mode: min
      verbose: true
      strict: true
    strategy: null
    gpus: 1
    num_sanity_val_steps: 0

model:
  target: imitator.pl_style_trainer.Style_and_disp_final_layer_optim_voca
  params:
    init_from_ckpt: logs/biden_style_adapt/version_18/checkpoints/epoch=29-step=30.ckpt
    optim_params:
      lr: 0.0001
      weight_decay: 0
      lr_sch_factor: 0.85
      lr_sch_patience: 5000
    monitor: val/net_loss
    nn_model_cfg:
      target: imitator.models.nn_model.imitator
      params:
        dataset: "biden"
        vertice_dim: 15069
        feature_dim: 64
        period: 30
        gradient_accumulation_steps: 1
        num_identity_classes: 1
        train_teacher_forcing: False
        wav2vec_model: pretrained/wav2vec2-base-960h
        wav2vec_static_features: False
        num_dec_layers: 5
        fixed_channel: True
        style_concat: False
        train_subjects: "biden"
    loss_cfg:
      full_rec_loss: 1.0
      velocity_weight: 10.0

data:
  target: imitator.data.data_loader_actor_wise_custom_init_my.DataModuleFromConfig
  dataset: "biden_custom"
  params:
    dataset: "biden"
    dataset_root: D:/Purdue/ECE57000/reimplemention/Imitator/personalized_Ebiden
    wav_path: audio_split_1s
    vertices_path: disps_seg_1
    template_file: template_fixed_5023_faces.obj
    num_iden_cls: 1
    train_subjects: "biden"
    val_subjects: "biden"
    test_subjects: "biden"
    default_init_subject: biden
    batch_size: 1
    num_workers: 0
