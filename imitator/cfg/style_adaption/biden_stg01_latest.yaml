config: ${model}              # ✅ 直接写 null，不要用 ${model}
lightning_config: ${lightning}    # ✅ 同上

lightning:
  trainer:
    max_epochs: 50
    accelerator: gpu
    devices: 1
    check_val_every_n_epoch: 2
    save_top_k: 1
    progress_bar_refresh_rate: 50
    early_stopping_metric:
      patience: 20
      mode: min
      verbose: True
      strict: True
    accumulate_grad_batches: 1
  logger:
    target: pytorch_lightning.loggers.TensorBoardLogger
    params:
      name: tb
      save_dir: logs
  modelcheckpoint:
    target: pytorch_lightning.callbacks.ModelCheckpoint
    params:
      dirpath: logs
      filename: "{epoch:02d}"
      save_last: true
      verbose: true
      monitor: val/net_loss
      mode: min
      save_top_k: 1

  callbacks:
    setup_callback:
      target: main.SetupCallback
      params:
        resume: false
        now: "2025-04-12T00-00-00"  # ✅加一个任意非空字符串
        logdir: logs
        ckptdir: logs/checkpoints
        cfgdir: logs/configs

    learning_rate_logger:
      target: main.LearningRateMonitor
      params:
        logging_interval: step

model:
  target: imitator.pl_style_trainer.Style_only_optim
  params:
    optim_params:
      lr: 0.0001
      weight_decay: 0
      lr_sch_factor: 0.85
      lr_sch_patience: 5000
    monitor: val/net_loss
    init_from_ckpt: pretrained_model/generalized_model_mbp_vel_original/checkpoints/epoch=000149.ckpt
    nn_model_cfg:
      target: imitator.models.nn_model.imitator
      params:
        dataset: "vocaset"
        vertice_dim: 15069   # 如果你用的是5023个顶点的obj，请写 15069；如果是5118个，请写 15354
        feature_dim: 64
        period: 30
        gradient_accumulation_steps: 1
        num_identity_classes: 1
        train_teacher_forcing: False
        wav2vec_model: projects/dataset/voca_face_former/wav2vec2-base-960h
        wav2vec_static_features: False
        num_dec_layers: 5
        fixed_channel: True
        style_concat: False
        train_subjects: "biden"
    loss_cfg:
      full_rec_loss: 1.0
      velocity_weight: 10.0


data:
  target: imitator.data.data_loader_actor_wise_custom_init.DataModuleFromConfig
  dataset: "voca_former_vert_pred_full_training"
  params:
    batch_size: 4
    sequence_for_training: "0 18"
    sequence_for_validation: "18 21"
    sequence_for_testing: "21 24" 
    dataset: "vocaset"
    dataset_root: "projects/dataset/personalized_Ebiden"
    wav_path: "audio_split_5s"
    vertices_path: "disps_segmented_latest_v1"
    template_file: "templates_biden.pkl"
    num_iden_cls: 1
    train_subjects_all: "biden"
    default_init_subject: "biden"
    train_subjects: "biden"
    val_subjects: "biden"
    test_subjects: "biden"
